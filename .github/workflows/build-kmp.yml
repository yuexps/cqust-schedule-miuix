name: Build KMP Release (Android APK & iOS IPA)

on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: '构建 iOS IPA (arm64)'
        type: boolean
        default: true
      build_android:
        description: '构建 Android APK (arm64-v8a)'
        type: boolean
        default: false

jobs:
  build-android:
    name: Build Android Release APK (arm64-v8a)
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests & Build Release APK (R8)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace

      - name: Sign Release APK (If Secrets Configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          APK_DIR="app/build/outputs/apk/release"
          SRC_APK=$(find "$APK_DIR" -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$SRC_APK" ]; then
            echo "Error: Release APK not found in $APK_DIR"
            exit 1
          fi

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            "$APKSIGNER" sign \
              --ks release.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --key-pass pass:"$KEY_PASSWORD" \
              --out "$APK_DIR/cqust-schedule-android-arm64.apk" \
              "$SRC_APK"
            rm -f release.jks
            echo "FINAL_APK_PATH=$APK_DIR/cqust-schedule-android-arm64.apk" >> $GITHUB_ENV
          else
            cp "$SRC_APK" "$APK_DIR/cqust-schedule-android-arm64-unsigned.apk"
            echo "FINAL_APK_PATH=$APK_DIR/cqust-schedule-android-arm64-unsigned.apk" >> $GITHUB_ENV
          fi

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: cqust-schedule-android-arm64
          path: ${{ env.FINAL_APK_PATH }}

  build-ios:
    name: Build iOS Release IPA (arm64)
    if: ${{ inputs.build_ios }}
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Xcode Project & Build Release iOS App
        run: |
          chmod +x ./gradlew
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          cd iosApp
          xcodegen generate
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Info.plist & Compose Resources, Package Release IPA
        run: |
          APP_PATH=$(find iosApp/build/Build/Products/Release-iphoneos -name "CqustSchedule.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: CqustSchedule.app not found"
            exit 1
          fi
          if [ ! -d "$APP_PATH/compose-resources" ]; then
            echo "Error: compose-resources missing in $APP_PATH (will crash on launch)"
            ls -la "$APP_PATH"
            exit 1
          fi
          # Compose UIKit 启动时会校验该项，缺失即 abort 崩溃
          if [ "$(/usr/libexec/PlistBuddy -c 'Print :CADisableMinimumFrameDurationOnPhone' "$APP_PATH/Info.plist" 2>/dev/null)" != "true" ]; then
            echo "Error: Info.plist 缺少 CADisableMinimumFrameDurationOnPhone=true (will crash on launch)"
            /usr/libexec/PlistBuddy -c 'Print' "$APP_PATH/Info.plist"
            exit 1
          fi
          EXPECTED_VERSION=$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([^"]+)"?$/\1/p' iosApp/project.yml | head -n 1)
          ACTUAL_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")
          if [ "$EXPECTED_VERSION" != "$ACTUAL_VERSION" ]; then
            echo "Error: Info.plist 版本 ($ACTUAL_VERSION) 与 project.yml ($EXPECTED_VERSION) 不一致"
            exit 1
          fi
          mkdir -p build_ipa/Payload
          cp -R "$APP_PATH" build_ipa/Payload/
          cd build_ipa
          zip -qry ../cqust-schedule-ios-arm64-unsigned.ipa Payload

      - name: Verify & Package dSYM (用于符号化 .ips 崩溃日志)
        run: |
          APP_DSYM=$(find iosApp/build/Build/Products/Release-iphoneos -maxdepth 2 -name "*.app.dSYM" -type d | head -n 1)
          if [ -z "$APP_DSYM" ]; then
            echo "Error: 缺少 app dSYM，.ips 崩溃日志无法符号化（检查 DEBUG_INFORMATION_FORMAT）"
            find iosApp/build/Build/Products/Release-iphoneos -maxdepth 3 -name "*.dSYM"
            exit 1
          fi
          mkdir -p build_dsym
          cp -R "$APP_DSYM" build_dsym/
          # 动态 framework 带独立 dSYM；静态 framework 的符号已并入 app dSYM
          FW_DSYM=$(find shared/build -name "ComposeApp.framework.dSYM" -type d 2>/dev/null | head -n 1)
          if [ -n "$FW_DSYM" ]; then
            cp -R "$FW_DSYM" build_dsym/
          else
            echo "::warning::未找到 ComposeApp.framework.dSYM（静态 framework 符号通常已并入 app dSYM）"
          fi
          echo "== dSYM UUID（需与 .ips 的 binaryImages.uuid 对齐）=="
          find build_dsym -maxdepth 1 -name "*.dSYM" -type d -exec dwarfdump --uuid {} \;

      - name: Upload iOS Release IPA
        uses: actions/upload-artifact@v4
        with:
          name: cqust-schedule-ios-arm64
          path: cqust-schedule-ios-arm64-unsigned.ipa

      - name: Upload iOS Release dSYM
        uses: actions/upload-artifact@v4
        with:
          name: cqust-schedule-ios-dsym
          path: build_dsym/

name: iosApp
options:
  bundleIdPrefix: top.msfxp.schedule
  deploymentTarget:
    iOS: "16.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    # Info.plist 由 XcodeGen 依据 properties 全量生成，不可手改 iosApp/Info.plist
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh_CN
        CFBundleDisplayName: 重科课表
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Compose Multiplatform iOS 渲染要求，缺失会在启动时触发 PlistSanityCheck 崩溃
        CADisableMinimumFrameDurationOnPhone: true
        LSApplicationQueriesSchemes:
          - iosamap
          - baidumap
          - qqmap
          - mqqapi
        NSPhotoLibraryUsageDescription: 用于选取相册图片作为课表壁纸
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.msfxp.schedule.ios
        PRODUCT_NAME: CqustSchedule
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.1.4
        CURRENT_PROJECT_VERSION: 14
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - ComposeApp
          - -lsqlite3
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_CODE_COVERAGE: "NO"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -Osize
          DEAD_CODE_STRIPPING: "YES"
          DEPLOYMENT_POSTPROCESSING: "YES"
          STRIP_INSTALLED_PRODUCT: "YES"
          COPY_PHASE_STRIP: "YES"
          STRIP_STYLE: all
          DEBUG_INFORMATION_FORMAT: dwarf
    preBuildScripts:
      - name: Compile Kotlin Multiplatform Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "$ENABLE_PREVIEWS" = "YES" ] || [ "$SKIP_KMP_PREBUILD" = "YES" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode --no-daemon -Dorg.gradle.jvmargs="-Xmx6144M -Dfile.encoding=UTF-8"
